# Acrobot causal-structure study (env: acrobot, envs/acrobot.py, sim/acrobot.py).
# environment + data: used by datagen/generate.py --env acrobot
# model + training:   used by train_cc.py --config configs/causal_acrobot.yaml (same as cart-pole)

environment:
  frame_skip: 4          # one transition = 4 Euler sub-steps of 0.01 s = 0.04 s
  dt: 0.01
  image_size: 128
  action_range: [-3.0, 3.0]   # continuous torque on the elbow (N m)
  # Every episode draws its own physics uniformly from these ranges, constant within the episode
  # (datasets/ac_phys). Defaults: m1 = m2 = 1, l1 = l2 = 1, g = 9.8. Uniform rods: lc = l/2, I = m l^2/12.
  # The distractor (damped spring, period 2 s) has fixed physics.
physics_ranges:
  m1: [0.5, 2.0]
  m2: [0.5, 2.0]
  l1: [0.5, 1.5]
  l2: [0.5, 1.5]
  g: [4.9, 14.7]
  seed: 4242

data:
  seed: 42
  # uniform random torque each step: keeps u_t and u_{t-1} uncorrelated
  n_random_episodes: 900
  random_ep_len: 40
  random_init_angle: 3.14159
  random_init_vel: 1.0
  # PRBS, sign flips with probability 0.5 per step
  n_pe_episodes: 500
  pe_ep_len: 40
  pe_init_angle: 0.5
  pe_init_vel: 0.5
  pe_action_amplitudes: [0.5, 1.5, 3.0]
  pe_flip_prob: 0.5
  # passive: u = 0 from broad initial angles
  n_passive_episodes: 250
  passive_ep_len: 40
  passive_init_angle: 3.14159
  passive_init_vel: 2.0
  # energy pumping (u = 3 tanh(5 w2) + noise; power in = u * w2) from near hanging: reaches large swings
  n_swing_episodes: 250
  swing_ep_len: 40
  swing_init_angle: 0.2
  swing_init_vel: 0.2
  swing_action_noise_std: 1.0
  # distractor initial state (amplitude at most ~1.8 m, track is +-3.8 m)
  distractor_init_pos: 1.5
  distractor_init_vel: 3.0

model:
  action_context_dim: 2      # [u_{t-1}, u_t]
  use_action_history: true
  history_size: 5
  image_size: 128
  patch_size: 8
  latent_dim: 192
  use_frame_diff: true
  use_proprio: false         # pixels only
  vit_depth: 4
  vit_embed_dim: 192
  vit_heads: 3
  predictor_depth: 6
  predictor_dim_head: 64
  predictor_dropout: 0.1
  predictor_heads: 16
  predictor_hidden_dim: 192
  predictor_mlp_dim: 2048
  use_inverse_model: true
  inverse_hidden_dim: 256
  inverse_seq_len: 4

training:
  history: 5
  rollout_steps: 3
  horizon: 7
  batch_size: 64
  epochs: 200
  lr: 0.0001
  min_lr: 1.0e-06
  warmup_epochs: 5
  weight_decay: 0.001
  normalize_actions: true
  lambda_fwd: 0.0
  lambda_inverse: 1.0
  lambda_rollout: 1.0
  lambda_sigreg: 1.0
  sigreg_num_points: 17
  sigreg_num_slices: 128
  sigreg_variance_floor_weight: 0.0
  num_workers: 0
  checkpoint_every: 10
  probe_every: 10
