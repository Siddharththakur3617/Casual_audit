# Cart-pole: environment, physics ranges and dataset policies (envs/cartpole.py, sim/cartpole.py).
# Read by datagen/generate.py and by the checks (physics_ranges).

environment:
  frame_skip: 2          # one transition = 2 Euler sub-steps of 0.02 s
  dt: 0.02
  image_size: 128
  action_range: [-10.0, 10.0]
  # physics stays at the env defaults: M=1.0, m=0.1, l=0.5, g=9.8, no friction
  # (datasets/cc). With generate.py --vary-physics (datasets/cc_phys) every episode draws its
  # own physics uniformly from these ranges, constant within the episode:
physics_ranges:
  M: [0.5, 2.0]      # cart mass (kg), default 1.0
  m: [0.05, 0.5]     # pole mass (kg), default 0.1
  l: [0.25, 0.75]    # pole HALF-length (m), default 0.5 -> pole 0.5 .. 1.5 m, drawn at its true length
  g: [4.9, 14.7]     # gravity (m/s^2), default 9.8 (0.5x .. 1.5x)
  seed: 4242         # separate stream, so the physics draws do not shift the action/initial-state draws

data:
  seed: 42
  # uniform random force each step: keeps u_t and u_{t-1} uncorrelated
  n_random_episodes: 900
  random_ep_len: 40
  random_init_range: 0.2
  # PRBS, sign flips with probability 0.5 per step
  n_pe_episodes: 500
  pe_ep_len: 40
  pe_init_range: 0.05
  pe_action_amplitudes: [1.0, 3.0, 6.0]
  pe_flip_prob: 0.5
  # passive: u = 0, pole falls on its own
  n_passive_episodes: 250
  passive_ep_len: 40
  passive_init_range: 0.05
  # broad pole angles, LQR + noise
  n_angle_episodes: 250
  angle_ep_len: 20
  angle_min: 0.1
  angle_max: 1.0
  angle_action_noise_std: 1.0
  # no plain LQR / near-equilibrium episodes
  n_lqr_episodes: 0
  n_equilibrium: 0
  max_abs_x: 2.2
  max_abs_theta: 1.2
